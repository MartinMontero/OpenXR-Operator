[project]
name = "openxr-operator"
version = "0.1.0"
description = "Local-only AI agent that observes and drives Godot XR applications"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "httpx",
    "pydantic>=2",
    "pyyaml",
    "pillow",
    "numpy",
    "flask",
    "websockets",
    "jsonschema",
]

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff",
    "gdtoolkit",
    "cyclonedx-bom",
]

[project.scripts]
openxr-operator = "openxr_operator.cli:main"

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py311"
