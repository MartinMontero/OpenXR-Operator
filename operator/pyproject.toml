[project]
name = "openxr-operator"
version = "0.1.0"
description = "Local-first AI agent that observes and drives Godot XR applications"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "httpx",
    "pydantic>=2",
    "pyyaml",
    "pillow",
    "numpy",
    "flask",
    "websockets",
    "jsonschema",
]

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff",
    "gdtoolkit",
    "cyclonedx-bom",
]

[project.scripts]
openxr-operator = "openxr_operator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openxr_operator"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "jsonschema"
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
